[project]
name = "pyhelm3"
dynamic=["version"]
description = "Python library for managing Helm releases using Helm 3 and later (i.e. Tiller-less Helm)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml >= 6.0.2,<7",
    "pydantic >= 2.10.6,<3",
    "semver >= 2.9.1,<3"
]

[dependency-groups]
dev = [
    "black >= 26.5.1,<26.6",
    "hatch-vcs>=0.5.0",
    "pytest>=8.3.5,<9",
    "pytest-asyncio>=0.25.3,<0.26",
    "ruff>=0.15.22,<0.16",
]

[build-system]
requires = [
    "hatchling>=1.27",
    "hatch-vcs"
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
exclude = [
    "/uv.lock",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "I", # import sorting
]
